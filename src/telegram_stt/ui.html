<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>telegram-stt monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎧</text></svg>">
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#16191d; --muted:#6b7280; --line:#e3e6ea;
    --accent:#2563eb; --accent-soft:rgba(37,99,235,.12);
    --ok:#059669; --warn:#b45309; --bar:#e5e7eb; --hover:#f1f3f6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a21; --ink:#e7eaee; --muted:#9aa3b0;
            --line:#262b34; --accent:#60a5fa; --accent-soft:rgba(96,165,250,.16);
            --ok:#34d399; --warn:#fbbf24; --bar:#262b34; --hover:#1d212a; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width:1060px; margin:0 auto; padding:22px 18px 80px; }

  header { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:19px; margin:0; letter-spacing:-.01em; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok);
         display:inline-block; margin-right:5px; }
  .dot.off { background:#9ca3af; }
  .dot.live { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .sub { color:var(--muted); font-size:13px; }

  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:var(--radius); padding:15px 17px; margin-bottom:14px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.07em;
       color:var(--muted); margin:0 0 11px; font-weight:600; }
  .idle { color:var(--muted); font-style:italic; }
  .err { color:var(--warn); }
  .muted { color:var(--muted); font-size:12px; }
  .mono { font-family:var(--mono); font-size:12px; color:var(--muted); }

  /* live job */
  .job { display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap; }
  .job .name { font-weight:600; word-break:break-word; }
  .track { height:6px; background:var(--bar); border-radius:99px; overflow:hidden; margin-top:9px; }
  .fill { height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease; }

  /* stats */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; }
  .stat b { display:block; font-size:19px; font-weight:600; }
  .stat span { color:var(--muted); font-size:12px; }

  /* controls */
  .searchrow { display:flex; gap:8px; margin-bottom:12px; }
  input[type=search] { flex:1; min-width:0; padding:9px 12px; border:1px solid var(--line);
        border-radius:8px; background:var(--bg); color:var(--ink); font-size:14px; }
  input[type=search]:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .btn { display:inline-block; padding:4px 9px; font-size:12px; line-height:1.7;
         border:1px solid var(--line); border-radius:7px; background:transparent;
         color:var(--accent); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); background:var(--accent-soft); }
  .btn[disabled] { color:var(--muted); cursor:not-allowed; border-style:dashed; background:none; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary:hover { opacity:.9; }

  /* archive: table on wide screens, cards on narrow */
  .rows { display:flex; flex-direction:column; }
  /* Every .row is its own grid container, so a content-sized last column
     would resolve differently per row and headers would not line up with
     their values. All track sizes are therefore deterministic. */
  .row { display:grid; grid-template-columns:120px minmax(0,1fr) 64px 52px 34px 268px;
         gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row:hover { background:var(--hover); }
  .rowhead { padding-bottom:8px; border-bottom:1px solid var(--line);
             font-size:10px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); font-weight:600; }
  .rowhead:hover { background:none; }
  .src { font-weight:500; word-break:break-word; }
  .acts { display:flex; gap:4px; flex-wrap:nowrap; justify-content:flex-end; }

  @media (max-width:760px) {
    .wrap { padding:16px 12px 60px; }
    .row { grid-template-columns:1fr; gap:5px; padding:13px 0; }
    .rowhead { display:none; }
    .row .when::before { content:"when · "; color:var(--muted); }
    .row .dur::before  { content:"audio · "; color:var(--muted); }
    .row .took::before { content:"took · "; color:var(--muted); }
    .row .lang { display:none; }
    .acts { justify-content:flex-start; margin-top:6px; }
    .src { font-size:15px; }
  }

  /* search results */
  .card { border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:10px; }
  .card h3 { margin:0 0 2px; font-size:14px; word-break:break-word; }
  .hit { padding:7px 0 7px 11px; border-left:2px solid var(--line); margin:6px 0; }
  .hit:hover { border-left-color:var(--accent); }
  .ts { font-family:var(--mono); font-size:11px; color:var(--accent);
        margin-right:8px; cursor:pointer; border:0; background:none; padding:0; }
  .ts:hover { text-decoration:underline; }
  mark { background:var(--accent-soft); color:inherit; border-radius:2px; padding:0 2px; }

  /* dialogs */
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel);
           color:var(--ink); max-width:min(820px,94vw); width:100%; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .dhead { display:flex; justify-content:space-between; align-items:center; gap:12px;
           padding:13px 16px; border-bottom:1px solid var(--line); }
  .dhead strong { word-break:break-word; font-size:14px; }
  .dbody { padding:14px 16px; max-height:56vh; overflow:auto; }
  .dfoot { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
           padding:11px 16px; border-top:1px solid var(--line); }
  .x { background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer;
       line-height:1; padding:0 4px; }

  /* player */
  .player { padding:11px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
  .player audio { width:100%; height:34px; }
  .player .hint { font-size:11px; color:var(--muted); margin-top:6px; }

  /* transcript lines */
  .line { display:flex; gap:9px; padding:3px 6px; border-radius:5px; align-items:baseline; }
  .line:hover { background:var(--hover); }
  .line.active { background:var(--accent-soft); }
  .line .txt { flex:1; }
  .plain { white-space:pre-wrap; font-family:var(--mono); font-size:13px; line-height:1.65; }

  /* markdown */
  .md h2 { font-size:14px; margin:15px 0 6px; letter-spacing:0;
           text-transform:none; color:var(--ink); font-weight:600; }
  .md h2:first-child { margin-top:0; }
  .md ul { margin:4px 0 4px 18px; padding:0; }
  .md li { margin:3px 0; }
  .md p { margin:6px 0; }

  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--line);
          border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite;
          vertical-align:-2px; margin-right:7px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
           background:var(--ink); color:var(--bg); padding:8px 15px; border-radius:8px;
           font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:99; }
  .toast.show { opacity:.94; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>telegram-stt</h1>
    <span class="sub"><span class="dot" id="dot"></span><span id="health">connecting…</span></span>
  </header>

  <div class="panel" id="livePanel">
    <h2>Now processing</h2>
    <div id="current"><div class="idle">Nothing in progress.</div></div>
    <div id="queue"></div>
  </div>

  <div class="panel">
    <h2>Totals</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="panel">
    <h2>Archive</h2>
    <div class="searchrow">
      <input type="search" id="filter" placeholder="Search inside transcripts…  (press / to focus)">
      <button class="btn" onclick="clearSearch()">Clear</button>
    </div>
    <div id="searchResults"></div>
    <div id="history"><div class="idle">Loading…</div></div>
  </div>
</div>

<dialog id="viewer">
  <div class="dhead">
    <strong id="vtitle"></strong>
    <button class="x" onclick="viewer.close()" aria-label="Close">&times;</button>
  </div>
  <div class="player" id="vplayer" hidden>
    <!-- metadata, not none: seeking needs duration, and loadedmetadata
         never fires with preload="none" so a queued seek would hang -->
    <audio id="audio" controls preload="metadata"></audio>
    <div class="hint">Click any line to jump there.</div>
  </div>
  <div class="dbody" id="vbody"></div>
  <div class="dfoot">
    <button class="btn" onclick="copyText('vbody')">Copy</button>
    <a class="btn" id="vdownload" href="#">Download .txt</a>
    <button class="btn primary" id="vsummary">Summarise</button>
  </div>
</dialog>

<dialog id="summary">
  <div class="dhead">
    <strong id="stitle"></strong>
    <button class="x" onclick="summary.close()" aria-label="Close">&times;</button>
  </div>
  <div class="dbody md" id="sbody"></div>
  <div class="dfoot">
    <button class="btn" onclick="copyText('sbody')">Copy</button>
    <a class="btn" id="sdownload" href="#">Download .md</a>
    <button class="btn" onclick="summarize(currentId, currentTitle, true)">Regenerate</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let records = [], currentId = null, currentTitle = "", searchTimer = null;
let segments = [], lineEls = [], activeLine = -1;

/* ---------- formatting ---------- */
const fmtDur = s => {
  if (s == null) return "—";
  s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return h ? `${h}h${String(m).padStart(2,"0")}m` : m ? `${m}m${String(x).padStart(2,"0")}s` : `${x}s`;
};
const fmtClock = s => {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s/3600), m = String(Math.floor((s%3600)/60)).padStart(2,"0"),
        x = String(s%60).padStart(2,"0");
  return h ? `${h}:${m}:${x}` : `${m}:${x}`;
};
const fmtSize = b => {
  if (!b) return "—";
  const u = ["B","KB","MB","GB"]; let i = 0;
  while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
  return `${b.toFixed(i?1:0)} ${u[i]}`;
};
const esc = t => (t ?? "").toString().replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

async function copyText(id) {
  try { await navigator.clipboard.writeText($("#"+id).innerText); toast("Copied"); }
  catch { toast("Copy failed"); }
}

/* ---------- live status ---------- */
async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("#dot").className = "dot" + (s.model_ready ? (s.current ? " live" : "") : " off");
    $("#health").textContent =
      `${s.model_ready ? "ready" : "loading model"} · ${s.model.split("/").pop()} · up ${fmtDur(s.uptime)}`;

    if (s.current) {
      const c = s.current, pct = Math.round((c.fraction || 0) * 100);
      $("#current").innerHTML = `
        <div class="job">
          <div>
            <div class="name">${esc(c.file_name || c.label)}${c.resumed ? ` <span class="mono">(resumed)</span>` : ""}</div>
            <div class="mono">${esc(c.stage)} · ${fmtDur(c.duration)} audio · running ${fmtDur(c.elapsed)}</div>
          </div>
          <div class="mono">${pct}%</div>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
    } else {
      $("#current").innerHTML = `<div class="idle">Nothing in progress.</div>`;
    }
    $("#queue").innerHTML = s.waiting.length
      ? `<div class="muted" style="margin-top:10px">Waiting: ` +
        s.waiting.map(w => esc(w.file_name || w.kind)).join(", ") + `</div>`
      : "";
  } catch {
    $("#dot").className = "dot off";
    $("#health").innerHTML = `<span class="err">worker unreachable</span>`;
  }
}

/* ---------- archive ---------- */
let lastHistoryKey = "";
async function loadHistory() {
  try {
    const d = await (await fetch("/api/history")).json();
    const key = JSON.stringify(d.records.map(r => [r.id, r.has_summary]));
    records = d.records;
    $("#stats").innerHTML = `
      <div class="stat"><b>${d.stats.count}</b><span>transcriptions</span></div>
      <div class="stat"><b>${fmtDur(d.stats.audio_seconds)}</b><span>audio processed</span></div>
      <div class="stat"><b>${d.stats.characters.toLocaleString()}</b><span>characters</span></div>
      <div class="stat"><b>${fmtSize(d.disk)}</b><span>on disk</span></div>`;
    // Only redraw when something actually changed, so a background refresh
    // never yanks the page while you are reading it.
    if (key !== lastHistoryKey) { lastHistoryKey = key; render(); }
  } catch (e) {
    $("#history").innerHTML = `<div class="err">Could not load archive: ${esc(e.message)}</div>`;
  }
}

function render() {
  const q = $("#filter").value.toLowerCase();
  const rows = records.filter(r => !q ||
    JSON.stringify([r.original_name, r.timestamp, r.language, r.media_kind]).toLowerCase().includes(q));
  if (!rows.length) {
    $("#history").innerHTML = `<div class="idle">Nothing matches that filter.</div>`;
    return;
  }
  $("#history").innerHTML = `<div class="rows">
    <div class="row rowhead"><div>When</div><div>Source</div><div>Audio</div>
      <div>Took</div><div>Lang</div><div></div></div>
    ${rows.map(r => `
      <div class="row">
        <div class="when mono">${esc((r.timestamp||"").slice(0,16).replace("T"," "))}</div>
        <div class="src">${esc(r.original_name || r.media_kind)}</div>
        <div class="dur mono">${fmtDur(r.audio_seconds)}</div>
        <div class="took mono">${fmtDur(r.elapsed_seconds)}</div>
        <div class="lang mono">${esc(r.language || "—")}</div>
        <div class="acts">
          <button class="btn" onclick="preview('${esc(r.id)}')">Open</button>
          <button class="btn" onclick="summarize('${esc(r.id)}','${esc(r.original_name||r.id)}')">${r.has_summary ? "Summary" : "Summarise"}</button>
          <a class="btn" href="/api/download/text/${encodeURIComponent(r.id)}">.txt</a>
          ${r.has_audio ? `<a class="btn" href="/api/download/audio/${encodeURIComponent(r.id)}">audio</a>`
                        : `<button class="btn" disabled title="audio was not archived">audio</button>`}
        </div>
      </div>`).join("")}
  </div>`;
}

/* ---------- search ---------- */
function highlight(text, terms) {
  let out = esc(text);
  for (const t of terms) {
    if (!t) continue;
    out = out.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>");
  }
  return out;
}

async function runSearch(q) {
  const box = $("#searchResults");
  if (!q.trim()) { box.innerHTML = ""; $("#history").style.display = ""; return; }
  $("#history").style.display = "none";
  box.innerHTML = `<div class="idle"><span class="spin"></span>Searching…</div>`;
  try {
    const response = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const d = await response.json();
    if (!response.ok) {
      throw new Error(d.error || `HTTP ${response.status}`);
    }
    const results = Array.isArray(d.results) ? d.results : [];
    const terms = q.split(/\s+/).filter(Boolean);
    if (!results.length) {
      box.innerHTML = `<div class="idle">No transcript contains ${esc(q)}.</div>`;
      return;
    }
    box.innerHTML = results.map(r => `
      <div class="card">
        <h3>${esc(r.original_name || r.media_kind)}</h3>
        <div class="muted">${esc((r.timestamp||"").slice(0,16).replace("T"," "))} ·
          ${fmtDur(r.audio_seconds)} · ${r.total_matches} match${r.total_matches===1?"":"es"}</div>
        ${r.matches.map(m => `<div class="hit">
            <button class="ts" onclick="preview('${esc(r.id)}',${m.start})"
                    title="Open and play from here">${fmtClock(m.start)}</button>
            ${highlight(m.text.trim(), terms)}
          </div>`).join("")}
        ${r.total_matches > r.matches.length
          ? `<div class="muted">…and ${r.total_matches - r.matches.length} more</div>` : ""}
        <div style="margin-top:9px">
          <button class="btn" onclick="preview('${esc(r.id)}')">Open</button>
          <button class="btn" onclick="summarize('${esc(r.id)}','${esc(r.original_name||r.id)}')">Summarise</button>
        </div>
      </div>`).join("");
  } catch (e) {
    box.innerHTML = `<div class="err">Search failed: ${esc(e.message)}</div>`;
  }
}
function clearSearch() { $("#filter").value = ""; runSearch(""); render(); }

/* ---------- transcript viewer with audio ---------- */
async function preview(id, seekTo) {
  currentId = id;
  const audio = $("#audio");
  $("#vtitle").textContent = "Loading…";
  $("#vbody").innerHTML = `<div class="idle"><span class="spin"></span>Loading transcript…</div>`;
  $("#vdownload").href = `/api/download/text/${encodeURIComponent(id)}`;
  viewer.showModal();

  try {
    const d = await (await fetch(`/api/transcript/${encodeURIComponent(id)}`)).json();
    currentTitle = d.original_name || id;
    $("#vtitle").textContent = currentTitle;
    $("#vsummary").onclick = () => { viewer.close(); summarize(id, currentTitle); };

    segments = d.segments || [];
    if (d.has_audio) {
      $("#vplayer").hidden = false;
      // Set src only when opening, so 26 MB is never fetched for a file
      // nobody plays. Range requests make the seek itself cheap.
      audio.src = `/api/audio/${encodeURIComponent(id)}`;
    } else {
      $("#vplayer").hidden = true;
      audio.removeAttribute("src");
    }

    if (segments.length) {
      $("#vbody").innerHTML = segments.map((s, i) =>
        `<div class="line" data-i="${i}" onclick="seek(${s.start})">
           <button class="ts">${fmtClock(s.start)}</button>
           <span class="txt">${esc(s.text)}</span>
         </div>`).join("");
      lineEls = [...document.querySelectorAll("#vbody .line")];
    } else {
      $("#vbody").innerHTML = `<div class="plain">${esc(d.text)}</div>`;
      lineEls = [];
    }
    if (seekTo != null && d.has_audio) seek(seekTo, true);
  } catch (e) {
    $("#vbody").innerHTML = `<div class="err">Could not load: ${esc(e.message)}</div>`;
  }
}

function seek(seconds, autoplay) {
  const audio = $("#audio");
  if (!audio.src) return;
  const go = () => {
    audio.currentTime = seconds;
    if (autoplay) audio.play().catch(() => {});
  };
  // Seeking before metadata arrives silently does nothing.
  if (audio.readyState >= 1) { go(); return; }
  audio.addEventListener("loadedmetadata", go, { once: true });
  audio.load();          // make sure metadata is actually being fetched
}

$("#audio").addEventListener("timeupdate", () => {
  if (!segments.length || !lineEls.length) return;
  const t = $("#audio").currentTime;
  let idx = -1;
  for (let i = 0; i < segments.length; i++) {
    if (segments[i].start <= t) idx = i; else break;
  }
  if (idx === activeLine) return;
  if (lineEls[activeLine]) lineEls[activeLine].classList.remove("active");
  activeLine = idx;
  const el = lineEls[idx];
  if (el) { el.classList.add("active"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
});

viewer.addEventListener("close", () => { const a = $("#audio"); a.pause(); });

/* ---------- summaries ---------- */
function md(text) {
  const lines = esc(text).split("\n");
  let html = "", inList = false;
  for (let line of lines) {
    line = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${line.replace(/^\s*[-*]\s+/, "")}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    if (/^#{1,6}\s/.test(line)) html += `<h2>${line.replace(/^#{1,6}\s/, "")}</h2>`;
    else if (line.trim()) html += `<p>${line}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

async function summarize(id, title, force) {
  currentId = id; currentTitle = title || currentTitle;
  $("#stitle").textContent = currentTitle;
  $("#sdownload").href = `/api/download/summary/${encodeURIComponent(id)}`;
  $("#sdownload").style.display = "none";
  summary.showModal();

  if (!force) {
    const cached = await fetch(`/api/summary/${encodeURIComponent(id)}`);
    if (cached.ok) {
      $("#sbody").innerHTML = md((await cached.json()).summary);
      $("#sdownload").style.display = "";
      return;
    }
  }
  $("#sbody").innerHTML = `<div class="idle"><span class="spin"></span>
    Asking the local model… long meetings are summarised in parts, which can take several minutes.</div>`;
  try {
    const res = await fetch(`/api/summarize/${encodeURIComponent(id)}`, { method: "POST" });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
    $("#sbody").innerHTML = md(d.summary);
    $("#sdownload").style.display = "";
    lastHistoryKey = ""; loadHistory();
  } catch (e) {
    $("#sbody").innerHTML = `<div class="err">Could not summarise: ${esc(e.message)}</div>`;
  }
}

/* ---------- input ---------- */
$("#filter").addEventListener("input", e => {
  render();
  clearTimeout(searchTimer);
  const q = e.target.value;
  searchTimer = setTimeout(() => runSearch(q), 350);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#filter")
      && !document.querySelector("dialog[open]")) {
    e.preventDefault(); $("#filter").focus();
  }
});

poll(); loadHistory();
setInterval(poll, 1000);
setInterval(loadHistory, 15000);
</script>
</body>
</html>
