[project]
name = "telegram-stt"
version = "0.1.0"
description = "Telegram voice/audio transcription bot backed by a local Bot API server and MLX Whisper large-v3-turbo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "mlx-whisper>=0.4.3",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_stt"]
artifacts = ["src/telegram_stt/ui.html"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the real Whisper model (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
