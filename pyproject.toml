[project]
name = "telegram-stt"
version = "0.1.0"
description = "Telegram voice/audio transcription bot backed by a local Bot API server and MLX Whisper large-v3-turbo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "mlx-whisper>=0.4.3",
    "onnxruntime>=1.28.0",
    "sherpa-onnx>=1.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_stt"]
